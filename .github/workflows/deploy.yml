# ============================================================
# Hexo Blog - GitHub Pages 自动部署工作流
# 分支策略:
#   main    → Hexo 源码分支（手动维护）
#   gh-pages → 构建产物分支（自动维护，请勿手动操作）
# ============================================================
name: Deploy Hexo to GitHub Pages

on:
  # 推送 main 分支时触发
  push:
    branches:
      - main
  # 允许手动触发
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: '向 IndexNow 全量推送 sitemap 里的所有博文（默认只推变更部分）'
        type: boolean
        default: false

# 权限设置：允许写入内容以部署到 gh-pages 分支
permissions:
  contents: write
  pages: write
  id-token: write

# 确保同一时间只有一个部署任务运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 拉取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 安装依赖
        run: |
          npm ci

      - name: 🏗️ 构建静态文件
        run: |
          npm run build

      - name: 🚀 部署到 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: deploy updated site [skip ci]'

      # 必须留在部署步骤之后：站点发布成功才推送。
      # 只推本次新增/修改的博文（删除的被跳过，理由见脚本注释），基线取
      # github.event.before。基线不可用时的行为见 tools/indexnow.js 顶部注释。
      # 该步失败会让 job 标红，以便暴露密钥或 host 配置问题。
      - name: 🔔 推送变更博文到 IndexNow
        env:
          # push 事件专有；workflow_dispatch 没有这个字段，会渲染成空串
          INDEXNOW_SINCE: ${{ github.event.before }}
        run: |
          if [ "${{ inputs.indexnow_all }}" = "true" ]; then
            node tools/indexnow.js --all
          else
            node tools/indexnow.js
          fi
