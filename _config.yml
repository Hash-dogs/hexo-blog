# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 我的技术博客
subtitle: '记录学习与技术分享'
description: 'hash-dog 的技术博客'
keywords: 技术,博客,编程,开发
author: hash-dog
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://hash-dogs.github.io/hexo-blog
root: /hexo-blog/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  # Google Search Console 的 HTML 文件验证：必须原样拷贝，不能被主题布局包裹渲染。
  # 删除该文件会导致 GSC 定期复检失败、属性失去验证，勿删。
  - 'google*.html'

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Search
search:
  path: search.json
  field: post
  format: html
  limit: 10000

# 留言板 (Message Board)
# -----------------------------------------------------------------------------
# 由 hexo-butterfly-envelope 插件生成 /comments/ 页面（信封样式）。
# 官方文档：https://docs.anheyu.com/page/message.html
# 插件读取顺序为「站点 _config.yml 优先，其次主题配置」，故写在这里。
# 注意：custom_pic 四个键必须齐全。插件源码直接解引用 config.custom_pic.cover，
# 漏写 custom_pic 会抛 TypeError 让整站生成失败。
envelope_comment:
  enable: true
  # 信封素材。任一项留空会回落到 unpkg.zhimg.com 的旧图源，该域名已不可靠，勿留空。
  custom_pic:
    cover: https://npm.elemecdn.com/hexo-butterfly-envelope/lib/violet.jpg
    line: https://npm.elemecdn.com/hexo-butterfly-envelope/lib/line.png
    beforeimg: https://npm.elemecdn.com/hexo-butterfly-envelope/lib/before.png
    afterimg: https://npm.elemecdn.com/hexo-butterfly-envelope/lib/after.png
  # 信纸上的问候语，逐行显示
  message:
    - 有什么想问的？
    - 有什么想说的？
    - 有什么想吐槽的？
    - 哪怕是有什么想吃的，都可以告诉我哦~
  bottom: 自动书记人偶竭诚为您服务！ # 仅支持单行文本
  height: 1024px # 鼠标悬停时信封展开的高度
  path: comments # 生成 comments/index.html
  # 生成页面的 front-matter。type 供主题做页面样式分支，勿删。
  front_matter:
    title: 留言板
    comments: true
    top_img: false
    type: envelope

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: anzhiyu

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''
